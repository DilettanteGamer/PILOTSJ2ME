[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilots-resource-editor"
version = "0.1.0"
description = "Standalone editor for resources supplied by a local Windows game installation"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.7,<7", "Pillow>=10"]

[project.scripts]
pilots-editor = "pilots_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]
