name: Windows editor
on:
  push:
    branches: [windows-resource-editor]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install . -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: PilotsEditor-Windows-x64
          path: dist/PilotsEditor/
          if-no-files-found: error
